<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chroma Velocity - Cross Device</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: radial-gradient(circle at center, #0b0b26 0%, #020208 100%);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            border: 2px solid #00f0ff;
            max-width: 100%;
            max-height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 8px #ff007f;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

let score = 0;
let gameOver = false;

// Kontrol Keyboard
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Roket
const rocket = {
    x: 100,
    y: canvas.height / 2,
    targetY: canvas.height / 2,
    targetX: 100,
    width: 30,
    height: 16,
    speed: 6,
    color: '#00f0ff'
};

// Kontrol Sentuh (Mobile/Tablet)
let isTouching = false;

function getCanvasCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    isTouching = true;
    const coords = getCanvasCoordinates(e);
    rocket.targetX = coords.x;
    rocket.targetY = coords.y;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (isTouching) {
        const coords = getCanvasCoordinates(e);
        rocket.targetX = coords.x;
        rocket.targetY = coords.y;
    }
}, { passive: false });

canvas.addEventListener('touchend', () => isTouching = false);

// Partikel & Obstacle
const particles = [];
const obstacles = [];

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 2;
        this.speedX = -Math.random() * 4 - 2;
        this.speedY = (Math.random() - 0.5) * 2;
        this.color = Math.random() > 0.5 ? '#ff007f' : '#00f0ff';
        this.life = 1;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= 0.04;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.life, 0);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class Obstacle {
    constructor() {
        this.x = canvas.width + 30;
        this.y = Math.random() * (canvas.height - 40) + 20;
        this.size = Math.random() * 18 + 12;
        this.speed = Math.random() * 3 + 3.5;
        this.color = '#39ff14';
    }
    update() {
        this.x -= this.speed;
    }
    draw() {
        ctx.save();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}

function updateRocketPosition() {
    // Gerakan via Keyboard
    if (keys['ArrowUp'] || keys['w']) rocket.y -= rocket.speed;
    if (keys['ArrowDown'] || keys['s']) rocket.y += rocket.speed;
    if (keys['ArrowLeft'] || keys['a']) rocket.x -= rocket.speed;
    if (keys['ArrowRight'] || keys['d']) rocket.x += rocket.speed;

    // Gerakan via Touch (Interpolasi halus menuju posisi sentuhan)
    if (isTouching) {
        rocket.x += (rocket.targetX - rocket.x) * 0.15;
        rocket.y += (rocket.targetY - rocket.y) * 0.15;
    }

    // Batas Layar
    rocket.x = Math.max(20, Math.min(canvas.width - 40, rocket.x));
    rocket.y = Math.max(20, Math.min(canvas.height - 20, rocket.y));
}

function drawRocket() {
    ctx.save();
    ctx.fillStyle = rocket.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = rocket.color;
    
    ctx.beginPath();
    ctx.moveTo(rocket.x + rocket.width, rocket.y);
    ctx.lineTo(rocket.x, rocket.y - rocket.height / 2);
    ctx.lineTo(rocket.x + 5, rocket.y);
    ctx.lineTo(rocket.x, rocket.y + rocket.height / 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    particles.push(new Particle(rocket.x, rocket.y));
}

function spawnObstacles() {
    if (Math.random() < 0.035) {
        obstacles.push(new Obstacle());
    }
}

function checkCollision(circle, rect) {
    let distX = Math.abs(circle.x - rect.x - rect.width / 2);
    let distY = Math.abs(circle.y - rect.y);

    if (distX > (rect.width / 2 + circle.size)) return false;
    if (distY > (rect.height / 2 + circle.size)) return false;

    if (distX <= (rect.width / 2)) return true; 
    if (distY <= (rect.height / 2)) return true;

    let dx = distX - rect.width / 2;
    let dy = distY - rect.height / 2;
    return (dx * dx + dy * dy <= (circle.size * circle.size));
}

function gameLoop() {
    if (gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updateRocketPosition();
    drawRocket();

    // Loop Partikel
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // Loop Obstacle
    spawnObstacles();
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].update();
        obstacles[i].draw();

        if (checkCollision(obstacles[i], rocket)) {
            gameOver = true;
            alert('GAME OVER! Score: ' + score);
            document.location.reload();
        }

        if (obstacles[i].x < -30) {
            obstacles.splice(i, 1);
            score += 10;
            scoreEl.innerText = score;
        }
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
